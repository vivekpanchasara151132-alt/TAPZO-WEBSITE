<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAPZO Digital Business Landing Page — Live Preview</title>
  <meta name="description" content="Experience a live TAPZO Smart NFC Digital Business Landing Page for Premium and Pro packages.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .profile-shell {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.25rem 3.5rem;
      background: radial-gradient(circle at 50% 0%, rgba(214, 183, 121, 0.1), transparent 55%), var(--bg-primary);
    }
    .profile-topbar {
      width: min(100%, 480px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.75rem;
      gap: 1rem;
    }
    .profile-card {
      width: min(100%, 480px);
      background-color: var(--bg-secondary);
      border: 1px solid var(--accent-gold-border);
      border-radius: 20px;
      padding: 2.25rem 1.65rem;
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.6);
    }
    .profile-header {
      text-align: center;
      padding-bottom: 1.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }
    .profile-avatar {
      width: 76px;
      height: 76px;
      margin: 0 auto 1rem;
      border-radius: 50%;
      border: 1.5px solid var(--accent-gold);
      background: linear-gradient(145deg, rgba(214, 183, 121, 0.2), rgba(17, 19, 21, 0.9));
      display: grid;
      place-items: center;
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent-gold);
    }
    .profile-name {
      font-family: var(--font-heading);
      font-size: 1.45rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .profile-role {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }
    .profile-tier-pill {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 0.28rem 0.85rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--accent-gold-border);
      color: var(--accent-gold);
      background-color: var(--accent-gold-dim);
    }
    .plan-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      background: var(--bg-primary);
      padding: 0.3rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-card);
      margin-bottom: 1.5rem;
    }
    .plan-switcher button {
      background: transparent;
      border: none;
      padding: 0.55rem;
      border-radius: 4px;
      font-family: var(--font-heading);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
    }
    .plan-switcher button.active {
      background-color: var(--accent-gold);
      color: #111315;
    }
    .profile-links {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .profile-link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.95rem 1.1rem;
      border-radius: var(--radius-md);
      background-color: var(--bg-primary);
      border: 1px solid var(--border-card);
      transition: border-color var(--transition-fast), transform var(--transition-fast);
    }
    .profile-link-btn:hover {
      border-color: var(--accent-gold);
      transform: translateY(-2px);
    }
    .profile-link-btn__left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .profile-link-btn__icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background-color: var(--accent-gold-dim);
      display: grid;
      place-items: center;
      color: var(--accent-gold);
      flex-shrink: 0;
    }
    .profile-link-btn__title {
      font-family: var(--font-heading);
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .profile-link-btn__sub {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
    .profile-footer {
      text-align: center;
      margin-top: 1.75rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-subtle);
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .profile-footer strong {
      color: var(--accent-gold);
      letter-spacing: 0.14em;
    }
  </style>
</head>
<body>
  <main class="profile-shell">
    <div class="profile-topbar">
      <a href="index.html#products" class="btn btn--ghost btn--sm">&larr; Back to TAPZO</a>
      <a href="index.html#contact" class="btn btn--primary btn--sm">Order This Page</a>
    </div>

    <section class="profile-card" aria-label="Sample TAPZO Digital Business Landing Page">
      <div class="plan-switcher" role="tablist" aria-label="Preview Package Tier">
        <button type="button" role="tab" id="tabPremium" aria-selected="true" class="active">TAPZO Premium (₹799)</button>
        <button type="button" role="tab" id="tabPro" aria-selected="false">TAPZO Pro (₹1,299)</button>
      </div>

      <header class="profile-header">
        <div class="profile-avatar">TZ</div>
        <h1 class="profile-name">TAPZO Studio</h1>
        <p class="profile-role">Smart NFC Business Solutions • Gujarat, India</p>
        <span class="profile-tier-pill" id="tierBadge">Premium Digital Landing Page</span>
      </header>

      <div class="profile-links" id="profileLinks">
        <!-- Populated dynamically for Premium / Pro -->
      </div>

      <div style="margin-top: 1.15rem;">
        <button type="button" id="saveVcfBtn" class="btn btn--primary btn--full">Save Business Contact (.vcf)</button>
      </div>

      <footer class="profile-footer">
        Powered by <strong>TAPZO</strong> • Tap. Connect. Grow.
      </footer>
    </section>
  </main>

  <script>
    (() => {
      const linksContainer = document.getElementById('profileLinks');
      const tierBadge = document.getElementById('tierBadge');
      const tabPremium = document.getElementById('tabPremium');
      const tabPro = document.getElementById('tabPro');
      const saveVcfBtn = document.getElementById('saveVcfBtn');

      const premiumLinks = [
        { title: 'Rate Us on Google', sub: 'Leave a Google Rating & Review', href: 'https://www.google.com/search?q=TAPZO+Gujarat', icon: 'star' },
        { title: 'Chat on WhatsApp', sub: '+91 97371 75978', href: 'https://wa.me/919737175978', icon: 'message' },
        { title: 'Follow on Instagram', sub: '@tapzo.india', href: 'https://www.instagram.com/', icon: 'camera' },
        { title: 'Connect on Facebook', sub: 'TAPZO Smart Solutions', href: 'https://www.facebook.com/', icon: 'share' }
      ];

      const proExtraLinks = [
        { title: 'Visit Official Website', sub: 'Explore packages & custom branding', href: 'index.html', icon: 'globe' },
        { title: 'YouTube Channel', sub: 'Product demos & setup guides', href: 'https://www.youtube.com/', icon: 'play' },
        { title: 'LinkedIn Profile', sub: 'Corporate & B2B enquiries', href: 'https://www.linkedin.com/', icon: 'briefcase' },
        { title: 'Google Maps Location', sub: 'Gujarat, India', href: 'https://maps.google.com/?q=Gujarat,India', icon: 'pin' },
        { title: 'Call Directly', sub: '+91 97371 75978', href: 'tel:+919737175978', icon: 'phone' },
        { title: 'Send an Email', sub: 'hello@tapzo.in', href: 'mailto:hello@tapzo.in', icon: 'mail' }
      ];

      const icons = {
        star: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>',
        message: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>',
        camera: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/></svg>',
        share: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>',
        globe: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
        play: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"/></svg>',
        briefcase: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
        pin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
        phone: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
        mail: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>'
      };

      function renderPlan(plan) {
        const isPro = plan === 'pro';
        tabPremium.classList.toggle('active', !isPro);
        tabPremium.setAttribute('aria-selected', String(!isPro));
        tabPro.classList.toggle('active', isPro);
        tabPro.setAttribute('aria-selected', String(isPro));
        tierBadge.textContent = isPro ? 'Pro Custom Landing Page' : 'Premium Digital Landing Page';

        const list = isPro ? [...premiumLinks, ...proExtraLinks] : premiumLinks;
        linksContainer.innerHTML = list.map((item) => `
          <a href="${item.href}" ${item.href.startsWith('http') ? 'target="_blank" rel="noopener noreferrer"' : ''} class="profile-link-btn">
            <span class="profile-link-btn__left">
              <span class="profile-link-btn__icon">${icons[item.icon]}</span>
              <span>
                <span class="profile-link-btn__title" style="display:block">${item.title}</span>
                <span class="profile-link-btn__sub">${item.sub}</span>
              </span>
            </span>
            <span style="color: var(--accent-gold); font-size: 0.9rem;">&rarr;</span>
          </a>
        `).join('');
      }

      const params = new URLSearchParams(window.location.search);
      const initialPlan = params.get('plan') === 'pro' ? 'pro' : 'premium';
      renderPlan(initialPlan);

      tabPremium.addEventListener('click', () => renderPlan('premium'));
      tabPro.addEventListener('click', () => renderPlan('pro'));

      saveVcfBtn.addEventListener('click', () => {
        const vcard = [
          'BEGIN:VCARD',
          'VERSION:3.0',
          'FN:TAPZO Smart NFC Solutions',
          'ORG:TAPZO',
          'TEL;TYPE=WORK,VOICE:+919737175978',
          'ADR;TYPE=WORK:;;Gujarat;;India',
          'NOTE:Tap. Connect. Grow.',
          'END:VCARD'
        ].join('\n');
        const blob = new Blob([vcard], { type: 'text/vcard' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'TAPZO-Contact.vcf';
        a.click();
        URL.revokeObjectURL(url);
      });
    })();
  </script>
</body>
</html>
